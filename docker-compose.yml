version: "3.8"

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: root # ensures Jenkins can access Docker socket if needed
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # optional: for Jenkins to run Docker commands
    restart: unless-stopped

volumes:
  jenkins_home:
# docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
